openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: YouTube Shorts Generator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Video processing jobs
  - name: outros
    description: Outro clip management
  - name: brands
    description: Brand management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /brands:
    get:
      operationId: listBrands
      tags: [brands]
      summary: List all brands
      responses:
        "200":
          description: List of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      operationId: createBrand
      tags: [brands]
      summary: Create a new brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandBody"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /brands/{id}:
    patch:
      operationId: updateBrand
      tags: [brands]
      summary: Update brand settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandBody"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBrand
      tags: [brands]
      summary: Delete a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new processing job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobWithClips"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{id}/content:
    get:
      operationId: getJobContent
      tags: [jobs]
      summary: Get AI-generated content for a completed job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "404":
          description: Job not found or content not yet generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: regenerateJobContent
      tags: [jobs]
      summary: Regenerate content for a job using stored transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Regenerated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "400":
          description: Job not completed or transcript not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clips/{clipId}/download:
    get:
      operationId: downloadClip
      tags: [jobs]
      summary: Download a clip file
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video file stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
  /outros:
    get:
      operationId: listOutros
      tags: [outros]
      summary: List all uploaded outro clips
      responses:
        "200":
          description: List of outros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Outro"
  /outros/{id}:
    patch:
      operationId: updateOutro
      tags: [outros]
      summary: Update outro metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutroBody"
      responses:
        "200":
          description: Updated outro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOutro
      tags: [outros]
      summary: Delete an outro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /outros/{id}/set-default:
    post:
      operationId: setDefaultOutro
      tags: [outros]
      summary: Set an outro as the default
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated outro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Brand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logoPath:
          type: ["string", "null"]
        voiceStyle:
          type: ["string", "null"]
        defaultCta:
          type: ["string", "null"]
        appendCtaToCopies:
          type: boolean
          description: When true, the brand CTA is automatically appended to all copied text
        introAudioPath:
          type: ["string", "null"]
        outroAudioPath:
          type: ["string", "null"]
        fontFamily:
          type: ["string", "null"]
          description: Google Font family name e.g. "Poppins"
        primaryColor:
          type: ["string", "null"]
          description: Brand primary color as hex e.g. "#f21178"
        secondaryColor:
          type: ["string", "null"]
          description: Brand secondary color as hex e.g. "#7c3aed"
        website:
          type: ["string", "null"]
          description: Brand website URL e.g. "https://tawmedia.com"
        exportFolderUrl:
          type: ["string", "null"]
          description: Google Drive or Dropbox folder URL for exports
        shortFormOutroPath:
          type: ["string", "null"]
          description: Path to short-form outro video file
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
    CreateBrandBody:
      type: object
      properties:
        name:
          type: string
        voiceStyle:
          type: ["string", "null"]
        defaultCta:
          type: ["string", "null"]
        appendCtaToCopies:
          type: boolean
        fontFamily:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        secondaryColor:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        exportFolderUrl:
          type: ["string", "null"]
      required:
        - name
    UpdateBrandBody:
      type: object
      properties:
        name:
          type: string
        voiceStyle:
          type: ["string", "null"]
        defaultCta:
          type: ["string", "null"]
        appendCtaToCopies:
          type: boolean
        fontFamily:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        secondaryColor:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        exportFolderUrl:
          type: ["string", "null"]
    CreateJobBody:
      type: object
      properties:
        youtubeUrl:
          type: string
        clipCount:
          type: integer
          default: 9
          minimum: 0
          maximum: 10
        clipDurationSeconds:
          type: integer
          default: 45
          description: Target duration in seconds for each short clip (15, 30, 45, 60, 90)
        contentCta:
          type: ["string", "null"]
          description: Call-to-action text to append to all text content
        outroId:
          type: ["integer", "null"]
        brandId:
          type: ["integer", "null"]
      required:
        - youtubeUrl
    Job:
      type: object
      properties:
        id:
          type: integer
        youtubeUrl:
          type: string
        videoTitle:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, downloading, transcribing, analyzing, rendering, completed, failed]
        errorMessage:
          type: ["string", "null"]
        clipCount:
          type: integer
        clipDurationSeconds:
          type: integer
        contentCta:
          type: ["string", "null"]
        outroId:
          type: ["integer", "null"]
        brandId:
          type: ["integer", "null"]
        hasContent:
          type: boolean
          description: Whether AI content has been generated for this job
        hasFacebookVideo:
          type: boolean
        hasPodcast:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - youtubeUrl
        - status
        - clipCount
        - clipDurationSeconds
        - hasContent
        - hasFacebookVideo
        - hasPodcast
        - createdAt
        - updatedAt
    Clip:
      type: object
      properties:
        id:
          type: integer
        jobId:
          type: integer
        title:
          type: string
        startSeconds:
          type: number
        endSeconds:
          type: number
        durationSeconds:
          type: number
        filePath:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, rendering, completed, failed]
        instagramCaption:
          type: ["string", "null"]
          description: Ready-to-paste Instagram caption for this clip
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - jobId
        - title
        - startSeconds
        - endSeconds
        - durationSeconds
        - status
        - createdAt
    JobWithClips:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          properties:
            clips:
              type: array
              items:
                $ref: "#/components/schemas/Clip"
          required:
            - clips
    NewsletterEmail:
      type: object
      properties:
        subject:
          type: string
          description: Email subject line
        body:
          type: string
          description: HTML email body for pasting into a CRM
      required:
        - subject
        - body
    GeneratedContent:
      type: object
      properties:
        videoTitle:
          type: string
        thumbnailUrl:
          type: string
        youtubeUrl:
          type: string
        blogPost:
          type: string
          description: Full blog post HTML with H1, H2, H3 and TL;DR
        threadPosts:
          type: array
          items:
            type: string
          description: 5 posts for X/Threads, each max 280 chars
        socialArticle:
          type: string
          description: HTML article for Facebook, Quora, and LinkedIn
        newsletterEmail:
          $ref: "#/components/schemas/NewsletterEmail"
        quotes:
          type: array
          items:
            type: string
          description: 5 powerful quotes from the transcript
        quoteImages:
          type: array
          items:
            type: string
          description: Legacy field - always empty array
        instagramCaptions:
          type: array
          items:
            type: string
          description: One Instagram/TikTok caption per quote
        carouselImages:
          type: array
          items:
            type: string
          description: Filenames of 4 infographic carousel slides - fetch via GET /api/images/{filename}
        carouselCaption:
          type: string
          description: Instagram caption for the carousel post
      required:
        - videoTitle
        - thumbnailUrl
        - youtubeUrl
        - blogPost
        - threadPosts
        - socialArticle
        - newsletterEmail
        - quotes
        - quoteImages
        - instagramCaptions
        - carouselImages
        - carouselCaption
    Outro:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        filePath:
          type: string
        isDefault:
          type: boolean
        position:
          type: string
          enum: [beginning, end]
        ctaText:
          type: ["string", "null"]
        ctaStartSeconds:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - filePath
        - isDefault
        - position
        - createdAt
    UpdateOutroBody:
      type: object
      properties:
        name:
          type: string
        position:
          type: string
          enum: [beginning, end]
        ctaText:
          type: ["string", "null"]
        ctaStartSeconds:
          type: ["number", "null"]
        isDefault:
          type: boolean
