openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: YouTube Shorts Generator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Video processing jobs
  - name: outros
    description: Outro clip management
  - name: brands
    description: Brand management
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /brands:
    get:
      operationId: listBrands
      tags: [brands]
      summary: List all brands
      responses:
        "200":
          description: List of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
    post:
      operationId: createBrand
      tags: [brands]
      summary: Create a new brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandBody"
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /brands/{id}/outros:
    get:
      operationId: listBrandOutros
      tags: [brands]
      summary: List all outros for a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of brand outros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandOutro"
    post:
      operationId: uploadBrandOutro
      tags: [brands]
      summary: Upload a new outro video for a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                ctaText:
                  type: string
      responses:
        "201":
          description: Brand outro created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandOutro"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /brands/{id}/outros/{outroId}:
    patch:
      operationId: updateBrandOutro
      tags: [brands]
      summary: Update a brand outro (e.g. name or CTA text)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: outroId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandOutroBody"
      responses:
        "200":
          description: Updated brand outro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandOutro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBrandOutro
      tags: [brands]
      summary: Delete a brand outro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: outroId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /brands/{id}/carousel-templates:
    get:
      operationId: listBrandCarouselTemplates
      tags: [brands]
      summary: List all carousel background template images for a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of brand carousel templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandCarouselTemplate"
    post:
      operationId: uploadBrandCarouselTemplate
      tags: [brands]
      summary: Upload a new carousel background template image for a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
      responses:
        "201":
          description: Brand carousel template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandCarouselTemplate"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /brands/{id}/carousel-templates/{templateId}/image:
    get:
      operationId: getBrandCarouselTemplateImage
      tags: [brands]
      summary: Fetch a brand carousel template's image bytes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Image bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /brands/{id}/carousel-templates/{templateId}:
    delete:
      operationId: deleteBrandCarouselTemplate
      tags: [brands]
      summary: Delete a brand carousel background template image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /brands/{id}/documents:
    get:
      operationId: listBrandDocuments
      tags: [brands]
      summary: List all documents for a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of brand documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrandDocument"
    post:
      operationId: uploadBrandDocument
      tags: [brands]
      summary: Upload a brand voice document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Brand document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandDocument"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /brands/{id}/documents/{docId}:
    delete:
      operationId: deleteBrandDocument
      tags: [brands]
      summary: Delete a brand document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /brands/{id}:
    patch:
      operationId: updateBrand
      tags: [brands]
      summary: Update brand settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrandBody"
      responses:
        "200":
          description: Updated brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBrand
      tags: [brands]
      summary: Delete a brand
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new processing job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobWithClips"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{id}/content:
    get:
      operationId: getJobContent
      tags: [jobs]
      summary: Get AI-generated content for a completed job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "404":
          description: Job not found or content not yet generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: regenerateJobContent
      tags: [jobs]
      summary: Regenerate content for a job using stored transcript
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Regenerated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"
        "400":
          description: Job not completed or transcript not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clips/{clipId}/download:
    get:
      operationId: downloadClip
      tags: [jobs]
      summary: Download a clip file
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video file stream
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
  /outros:
    get:
      operationId: listOutros
      tags: [outros]
      summary: List all uploaded outro clips
      responses:
        "200":
          description: List of outros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Outro"
  /outros/{id}:
    patch:
      operationId: updateOutro
      tags: [outros]
      summary: Update outro metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutroBody"
      responses:
        "200":
          description: Updated outro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOutro
      tags: [outros]
      summary: Delete an outro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /outros/{id}/set-default:
    post:
      operationId: setDefaultOutro
      tags: [outros]
      summary: Set an outro as the default
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated outro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outro"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    Brand:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logoPath:
          type: ["string", "null"]
        voiceStyle:
          type: ["string", "null"]
        defaultCta:
          type: ["string", "null"]
        appendCtaToCopies:
          type: boolean
          description: When true, the brand CTA is automatically appended to all copied text
        introAudioPath:
          type: ["string", "null"]
        outroAudioPath:
          type: ["string", "null"]
        fontFamily:
          type: ["string", "null"]
          description: Google Font family name e.g. "Poppins"
        primaryColor:
          type: ["string", "null"]
          description: Brand primary color as hex e.g. "#f21178"
        secondaryColor:
          type: ["string", "null"]
          description: Brand secondary color as hex e.g. "#7c3aed"
        website:
          type: ["string", "null"]
          description: Brand website URL e.g. "https://tawmedia.com"
        exportFolderUrl:
          type: ["string", "null"]
          description: Google Drive or Dropbox folder URL for exports
        shortFormOutroPath:
          type: ["string", "null"]
          description: Path to short-form outro video file
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
    CreateBrandBody:
      type: object
      properties:
        name:
          type: string
        voiceStyle:
          type: ["string", "null"]
        defaultCta:
          type: ["string", "null"]
        appendCtaToCopies:
          type: boolean
        fontFamily:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        secondaryColor:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        exportFolderUrl:
          type: ["string", "null"]
      required:
        - name
    UpdateBrandBody:
      type: object
      properties:
        name:
          type: string
        voiceStyle:
          type: ["string", "null"]
        defaultCta:
          type: ["string", "null"]
        appendCtaToCopies:
          type: boolean
        fontFamily:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        secondaryColor:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        exportFolderUrl:
          type: ["string", "null"]
    CreateJobBody:
      type: object
      properties:
        manualTranscript:
          type: string
          description: Paste a transcript directly. No video is downloaded or rendered — only written content is generated.
        clipCount:
          type: integer
          default: 9
          minimum: 0
          maximum: 10
          description: Number of clips for AI mode (used only when clipMode is "ai"; the app clamps this to 3-6). Ignored in "chapters" mode.
        clipDurationSeconds:
          type: integer
          default: 45
          description: Target duration in seconds for each short clip (15, 30, 45, 60, 90). Only used in AI mode.
        clipMode:
          type: string
          enum: [ai, chapters]
          default: ai
          description: How snippets are selected. "ai" lets the model pick 3-6 best moments; "chapters" creates one snippet per manually-entered chapter (see manualChapters, upload endpoint only).
        captionsEnabled:
          type: boolean
          default: true
          description: Whether to burn auto-generated closed captions into each snippet
        captionStyle:
          type: string
          enum: [classic, bold, boxed, brand]
          default: classic
          description: Visual style preset for burned-in captions
        showTitle:
          type: boolean
          default: true
          description: Whether to overlay the snippet title text at the top of the video
        titleFontColor:
          type: string
          enum: [white, black]
          default: white
          description: Font colour for the snippet title overlay
        showWatermark:
          type: boolean
          default: true
          description: Whether to overlay the brand logo as a watermark in the top-left corner (requires a brand with a logo)
        contentCta:
          type: ["string", "null"]
          description: Call-to-action text to append to all text content
        outroId:
          type: ["integer", "null"]
        brandId:
          type: ["integer", "null"]
        brandOutroIds:
          type: ["string", "null"]
          description: JSON array of brand outro IDs to rotate through, e.g. "[1,2,3]"
        generatePodcast:
          type: boolean
          default: true
          description: Whether to generate a podcast audio file (default true). Ignored when manualTranscript is provided.
        videoLayout:
          type: string
          enum: [normal, podcast]
          default: normal
          description: Layout for rendered clips — "normal" portrait crop, or "podcast" split-screen (left speaker on top / right speaker on bottom)
    Job:
      type: object
      properties:
        id:
          type: integer
        youtubeUrl:
          type: string
        videoTitle:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, downloading, transcribing, analyzing, rendering, completed, failed]
        errorMessage:
          type: ["string", "null"]
        clipCount:
          type: integer
        clipDurationSeconds:
          type: integer
        clipMode:
          type: string
          enum: [ai, chapters]
        captionsEnabled:
          type: boolean
        captionStyle:
          type: string
          enum: [classic, bold, boxed, brand]
        showTitle:
          type: boolean
        titleFontColor:
          type: string
          enum: [white, black]
          description: Font colour used for the snippet title overlay
        showWatermark:
          type: boolean
        contentCta:
          type: ["string", "null"]
        outroId:
          type: ["integer", "null"]
        brandId:
          type: ["integer", "null"]
        brandOutroIds:
          type: ["string", "null"]
          description: JSON array of brand outro IDs to rotate through
        hasContent:
          type: boolean
          description: Whether AI content has been generated for this job
        hasFacebookVideo:
          type: boolean
        hasPodcast:
          type: boolean
        hasThumbnail:
          type: boolean
          description: Whether a thumbnail image was uploaded for this job
        manualChapters:
          type: ["string", "null"]
          description: JSON array of manually-entered chapters ({title,start,end}[]) used when clipMode is "chapters"
        generatePodcast:
          type: boolean
          description: Whether podcast generation was requested for this job
        videoLayout:
          type: string
          enum: [normal, podcast]
          description: Layout mode used when rendering clips
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - youtubeUrl
        - status
        - clipCount
        - clipDurationSeconds
        - clipMode
        - captionsEnabled
        - captionStyle
        - showTitle
        - titleFontColor
        - showWatermark
        - hasContent
        - hasFacebookVideo
        - hasPodcast
        - hasThumbnail
        - generatePodcast
        - videoLayout
        - createdAt
        - updatedAt
    Clip:
      type: object
      properties:
        id:
          type: integer
        jobId:
          type: integer
        title:
          type: string
        startSeconds:
          type: number
        endSeconds:
          type: number
        durationSeconds:
          type: number
        filePath:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, rendering, completed, failed]
        instagramCaption:
          type: ["string", "null"]
          description: Ready-to-paste Instagram caption for this clip
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - jobId
        - title
        - startSeconds
        - endSeconds
        - durationSeconds
        - status
        - createdAt
    JobWithClips:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          properties:
            clips:
              type: array
              items:
                $ref: "#/components/schemas/Clip"
          required:
            - clips
    NewsletterEmail:
      type: object
      properties:
        subject:
          type: string
          description: Email subject line
        body:
          type: string
          description: HTML email body for pasting into a CRM
      required:
        - subject
        - body
    GeneratedContent:
      type: object
      properties:
        videoTitle:
          type: string
        thumbnailUrl:
          type: string
        youtubeUrl:
          type: string
        blogPost:
          type: string
          description: Full blog post HTML with H1, H2, H3 and TL;DR
        threadPosts:
          type: array
          items:
            type: string
          description: 5 posts for X/Threads, each max 280 chars
        socialArticle:
          type: string
          description: HTML article for Facebook, Quora, and LinkedIn
        newsletterEmail:
          $ref: "#/components/schemas/NewsletterEmail"
        quotes:
          type: array
          items:
            type: string
          description: 5 powerful quotes from the transcript
        quoteTimestamps:
          type: array
          items:
            type: number
