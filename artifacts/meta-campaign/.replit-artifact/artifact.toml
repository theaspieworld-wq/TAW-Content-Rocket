kind = "web"
previewPath = "/meta/"
title = "Meta Ads Campaign — Content Rocket"
version = "1.0.0"
id = "artifacts/meta-campaign"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/meta/" ]
localPort = 19024

[services.development]
run = "pnpm --filter @workspace/meta-campaign run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/meta-campaign", "run", "build" ]
publicDir = "artifacts/meta-campaign/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19024"
BASE_PATH = "/meta/"
