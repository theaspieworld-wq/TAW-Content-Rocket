kind = "web"
previewPath = "/"
title = "TAW Media Content Rocket"
version = "1.0.0"
id = "artifacts/shorts-generator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21675

[services.development]
run = "pnpm --filter @workspace/shorts-generator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shorts-generator", "run", "build" ]
publicDir = "artifacts/shorts-generator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21675"
BASE_PATH = "/"
